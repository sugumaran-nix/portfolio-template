<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>404 — Page not found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.cdnfonts.com/css/ballet" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blush:#FFB7C5;--blush-lt:#FFE4EC;--rose:#D4688A;
      --lavender:#C9B8F0;--lav-lt:#EDE8FC;--cream:#FFF5F7;
      --dark:#2A1A2E;--mid:#6E4B6E;--muted:#9D7A9D;
    }
    body{
      font-family:'DM Sans',system-ui,sans-serif;
      background:var(--cream);color:var(--dark);
      min-height:100vh;display:flex;align-items:center;
      justify-content:center;text-align:center;padding:2rem;
      overflow:hidden;
    }
    .blob{
      position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;
      animation:drift 10s ease-in-out infinite alternate;
    }
    .blob--1{width:380px;height:380px;background:radial-gradient(var(--blush),transparent 70%);top:-100px;left:-80px;animation-delay:0s}
    .blob--2{width:300px;height:300px;background:radial-gradient(var(--lavender),transparent 70%);bottom:-60px;right:-60px;animation-delay:-5s}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(20px,20px)}}
    .inner{position:relative;z-index:1;max-width:480px}
    .num{
      font-family:'Ballet',cursive;
      font-size:clamp(6rem,18vw,11rem);
      background:linear-gradient(135deg,var(--rose),var(--lavender));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      line-height:1;margin-bottom:.5rem;
    }
    .flower{font-size:2.5rem;margin-bottom:1.25rem;animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:300;font-style:italic;margin-bottom:.75rem;color:var(--dark)}
    p{color:var(--muted);font-size:.95rem;line-height:1.8;margin-bottom:2rem}
    .btn{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.75rem 1.75rem;border-radius:100px;font-size:.95rem;font-weight:500;
      background:linear-gradient(135deg,var(--rose),#c45f8a,var(--lavender));
      color:#fff;text-decoration:none;
      box-shadow:0 4px 20px rgba(212,104,138,.4);
      transition:transform .25s,box-shadow .25s;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(212,104,138,.5)}
  </style>
</head>
<body>
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="inner">
    <div class="flower">✿</div>
    <div class="num">404</div>
    <h1>This page got lost in the garden.</h1>
    <p>It seems the page you were looking for has wandered off somewhere. Let's get you back to somewhere beautiful.</p>
    <a href="index.html" class="btn">← Back to home</a>
  </div>
</body>
</html>
